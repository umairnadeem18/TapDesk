name: tapdesk_mobile
description: "TapDesk - your phone is the mouse, clicker and keyboard."
publish_to: 'none'

# Shown in the app store listing and in the website's download card.
# Kept in step with docs/protocol.md; bump only with the protocol.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management. Provider is the lighter of the two options in the plan:
  # the app has a handful of notifiers and no deep nesting, so Riverpod's
  # extra indirection would not earn its keep.
  provider: ^6.1.2

  # QR scanning on the pairing screen. Chosen over a raw camera plugin because
  # it bundles the MLKit barcode model and handles the camera lifecycle.
  mobile_scanner: ^5.2.3

  # Transport. We need raw WebSocket plus a custom TLS callback for certificate
  # pinning, so this is used directly rather than a higher-level client.
  web_socket_channel: ^3.0.1

  # Device key storage in the Android Keystore. Never store it in plain prefs.
  flutter_secure_storage: ^9.2.2

  # Non-sensitive preferences: paired device list, cursor speed, haptics,
  # left-handed layout. The device key itself is NOT stored here.
  shared_preferences: ^2.3.3

  # Vibration for the haptics requirement in docs/design-system.md.
  vibration: ^2.0.1

  # Keeps the screen awake while connected (PRD: optional, on by default).
  wakelock_plus: ^1.2.8

  # Bundled fonts. Pairing happens on a local network that may have no
  # internet, so the app must render identically offline.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
