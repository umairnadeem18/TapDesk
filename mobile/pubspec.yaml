name: tapdesk_mobile
description: "TapDesk - your phone is the mouse, clicker and keyboard."
publish_to: 'none'

# Shown in the app store listing and in the website's download card.
# Kept in step with docs/protocol.md; bump only with the protocol.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management. Provider is the lighter of the two options in the plan:
  # the app has a handful of notifiers and no deep nesting, so Riverpod's
  # extra indirection would not earn its keep.
  provider: ^6.1.2

  # QR scanning on the pairing screen. Chosen over a raw camera plugin because
  # it bundles the MLKit barcode model and handles the camera lifecycle.
  mobile_scanner: ^5.2.3

  # Transport. We need raw WebSocket plus a custom TLS callback for certificate
  # pinning, so this is used directly rather than a higher-level client.
  web_socket_channel: ^3.0.1

  # Device key storage in the Android Keystore. Never store it in plain prefs.
  flutter_secure_storage: ^9.2.2

  # Non-sensitive preferences: paired device list, cursor speed, haptics,
  # left-handed layout. The device key itself is NOT stored here.
  shared_preferences: ^2.3.3

  # Vibration for the haptics requirement in docs/design-system.md.
  # Removed - see the note on wakelock_plus below.

  # Keeps the screen awake while connected (PRD: optional, on by default).
  wakelock_plus: ^1.2.8
  # SHA-256 of the companion's certificate, for pinning. Pure Dart so the
  # fingerprint check runs identically in a unit test and on a phone.
  crypto: ^3.0.6

  # NOTE: no haptics package. The `vibration` plugin hard-codes
  # compileSdkVersion 33 and pulls AGP 7.4.0 into a project running AGP 9.1.0,
  # which fails the build with 15 AAR metadata errors. Flutter's built-in
  # HapticFeedback covers light/medium/heavy impact, which is all
  # design-system.md asks for. See lib/ui/haptics.dart.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android 2.3.0 moved to the `jni` package, which compiles C++
# and therefore requires the full Android NDK (~1 GB) at build time. TapDesk
# compiles no native code, and 2.2.23 is the last release before that rewrite.
# Pinning it keeps the NDK out of the build entirely.
#
# Revisit once a newer path_provider_android ships prebuilt binaries - do not
# just delete this and hope.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

  # Fonts are bundled, never fetched. Pairing happens on a local network that
  # may have no internet, so the app must render identically offline.
  # Fetched once by assets/fonts/fetch-fonts.ps1 - see that file for sources.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
